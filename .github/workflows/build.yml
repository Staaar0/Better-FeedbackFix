name: Build BetterFeedbackFix

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip clang g++-multilib zip git
          python3 -m pip install --upgrade pip setuptools wheel
          mkdir -p deps
          git clone --depth=1 https://github.com/alliedmodders/ambuild.git deps/ambuild
          python3 -m pip install ./deps/ambuild

      - name: Fetch Metamod and HL2SDK CS2
        shell: bash
        run: |
          git clone --depth=1 --recursive https://github.com/alliedmodders/metamod-source.git deps/metamod-source
          git clone --depth=1 --branch cs2 https://github.com/alliedmodders/hl2sdk.git deps/hl2sdk-cs2

      - name: Build
        shell: bash
        run: |
          mkdir -p build
          cd build
          python3 ../configure.py --enable-optimize --targets=x86_64 --hl2sdk-root=../deps --mms-path=../deps/metamod-source
          ambuild

      - name: Create Linux package
        shell: bash
        run: |
          cd build/package
          zip -r ../../BetterFeedbackFix-linux.zip .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: BetterFeedbackFix-linux
          path: BetterFeedbackFix-linux.zip

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install AMBuild
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          New-Item -ItemType Directory -Force -Path deps
          git clone --depth=1 https://github.com/alliedmodders/ambuild.git deps/ambuild
          python -m pip install ./deps/ambuild

      - name: Fetch Metamod and HL2SDK CS2
        shell: pwsh
        run: |
          git clone --depth=1 --recursive https://github.com/alliedmodders/metamod-source.git deps/metamod-source
          git clone --depth=1 --branch cs2 https://github.com/alliedmodders/hl2sdk.git deps/hl2sdk-cs2

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          Set-Location build
          python ../configure.py --enable-optimize --targets=x86_64 --hl2sdk-root=../deps --mms-path=../deps/metamod-source
          ambuild

      - name: Create Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path build/package/* -DestinationPath BetterFeedbackFix-windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BetterFeedbackFix-windows
          path: BetterFeedbackFix-windows.zip

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: github.event_name == 'push'

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: build-${{ github.run_number }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" \
            --title "BetterFeedbackFix $TAG_NAME" \
            --notes "Automated release for commit ${{ github.sha }}." \
            release/BetterFeedbackFix-linux/BetterFeedbackFix-linux.zip \
            release/BetterFeedbackFix-windows/BetterFeedbackFix-windows.zip
