name: Build BetterFeedbackFix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld git python3 python3-pip zip
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Fetch Metamod and HL2SDK CS2
        shell: bash
        run: |
          mkdir -p deps
          git clone --depth 1 https://github.com/alliedmodders/metamod-source deps/metamod-source
          git clone --depth 1 --branch cs2 https://github.com/alliedmodders/hl2sdk deps/hl2sdk-cs2
          git clone --depth 1 https://github.com/alliedmodders/hl2sdk-manifests deps/hl2sdk-manifests

      - name: Build
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build
          cd build
          python3 ../configure.py -s cs2 --targets=x86_64 --enable-optimize \
            --mms_path "$GITHUB_WORKSPACE/deps/metamod-source" \
            --hl2sdk-root "$GITHUB_WORKSPACE/deps" \
            --hl2sdk-manifests "$GITHUB_WORKSPACE/deps/hl2sdk-manifests"
          ambuild

      - name: Create Linux package
        shell: bash
        run: |
          cd build/package/cs2
          zip -r "$GITHUB_WORKSPACE/BetterFeedbackFix-linux.zip" .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: BetterFeedbackFix-linux
          path: BetterFeedbackFix-linux.zip

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install AMBuild
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Fetch Metamod and HL2SDK CS2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          git clone --depth 1 https://github.com/alliedmodders/metamod-source deps/metamod-source
          git clone --depth 1 --branch cs2 https://github.com/alliedmodders/hl2sdk deps/hl2sdk-cs2
          git clone --depth 1 https://github.com/alliedmodders/hl2sdk-manifests deps/hl2sdk-manifests

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          python ../configure.py -s cs2 --targets=x86_64 --enable-optimize `
            --mms_path "$env:GITHUB_WORKSPACE/deps/metamod-source" `
            --hl2sdk-root "$env:GITHUB_WORKSPACE/deps" `
            --hl2sdk-manifests "$env:GITHUB_WORKSPACE/deps/hl2sdk-manifests"
          ambuild

      - name: Create Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path build/package/cs2/* -DestinationPath BetterFeedbackFix-windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BetterFeedbackFix-windows
          path: BetterFeedbackFix-windows.zip

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: build-${{ github.run_number }}
        shell: bash
        run: |
          gh release delete "$TAG_NAME" -y --cleanup-tag || true
          gh release create "$TAG_NAME" \
            --target "${{ github.sha }}" \
            --title "BetterFeedbackFix $TAG_NAME" \
            --notes "Automated release for commit ${{ github.sha }}." \
            release/BetterFeedbackFix-linux/BetterFeedbackFix-linux.zip \
            release/BetterFeedbackFix-windows/BetterFeedbackFix-windows.zip
