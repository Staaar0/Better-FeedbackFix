name: Build BetterFeedbackFix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate project
        id: proj
        shell: bash
        run: |
          CSPROJ="$(find . -name 'BetterFeedbackFix.csproj' | head -n1)"
          if [ -z "$CSPROJ" ]; then
            echo "::error::BetterFeedbackFix.csproj not found anywhere in the repo."
            exit 1
          fi
          echo "Found project at: $CSPROJ"
          echo "csproj=$CSPROJ" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.proj.outputs.csproj }}"

      - name: Build
        run: dotnet build "${{ steps.proj.outputs.csproj }}" -c Release --no-restore -o build/out

      - name: Package
        shell: bash
        run: |
          # Lay out the CounterStrikeSharp plugin folder structure.
          PLUGIN_DIR="package/addons/counterstrikesharp/plugins/BetterFeedbackFix"
          mkdir -p "$PLUGIN_DIR"
          # Copy the plugin DLL and any dependency DLLs produced by the build.
          cp build/out/BetterFeedbackFix.dll "$PLUGIN_DIR/"
          find build/out -maxdepth 1 -name '*.dll' ! -name 'CounterStrikeSharp.API.dll' \
            -exec cp {} "$PLUGIN_DIR/" \;
          cd package
          zip -r "$GITHUB_WORKSPACE/BetterFeedbackFix.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterFeedbackFix
          path: BetterFeedbackFix.zip

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: BetterFeedbackFix
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: build-${{ github.run_number }}
        shell: bash
        run: |
          gh release delete "$TAG_NAME" -y --cleanup-tag || true
          gh release create "$TAG_NAME" \
            --target "${{ github.sha }}" \
            --title "BetterFeedbackFix $TAG_NAME" \
            --notes "Automated release for commit ${{ github.sha }}." \
            release/BetterFeedbackFix.zip
